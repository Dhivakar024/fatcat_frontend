<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Fatcat</title>
    <link rel="stylesheet" href="../contact/contact.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="/common-components/header.css">
    <link rel="stylesheet" href="/common-components/footer.css">

    <script src="/common-components/header.js" defer></script>
    <script src="/common-components/footer.js" defer></script>
    <script src="/theme.js" defer></script>
</head>

<body>
    <div id="header"></div>

   

    <!-- Contact Hero Section -->
    <section class="contact-hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title">Contact</h1>
            <p class="hero-subtitle">
                "Your Vision. Our Expertise.<br>
                Let’s Connect."
            </p>
        </div>
    </section>

    <!-- Get In Touch Section -->
    <section class="contact-section reveal">

        <div class="contact-container">

            <!-- LEFT : CONTACT FORM -->
            <div class="contact-left">

                <h2 class="contact-heading">
                    Get in <span>Touch</span>
                </h2>

                <p class="contact-text">
                    Send us your feedback or enquiries regarding our services.
                    We aim to respond quickly and ensure a smooth support experience.
                    Your input helps us improve and serve you better every day.
                </p>
                  <form id="contact-form" class="contact-form" action="https://formspree.io/f/xxxxxxx" method="POST">
                            <div class="form-group">
                                <label><i class="fa-solid fa-circle-user"></i> Name</label>
                                <input type="text" name="name" placeholder="Enter your name" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                                <input type="email" name="email" placeholder="Enter Your Email" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fa-solid fa-phone"></i> Phone Number</label>
                                <input type="tel" name="phone" placeholder="Enter your Phone Number" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fa-solid fa-location-dot"></i> Location</label>
                                <input type="text" name="location" placeholder="Enter your location" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fa-solid fa-pen-to-square"></i> Message</label>
                                <textarea rows="4" name="message" placeholder="Enter your message or questions here..."></textarea>
                            </div>
                            <div class="contact-terms-group">
                                <input type="checkbox" id="contactTerms" class="terms-checkbox" required>
                                <label for="contactTerms">I agree to the <a href="javascript:void(0)" class="open-legal-tab" data-legal="terms">Terms & Conditions</a></label>
                            </div>
                            <button type="submit" class="contact-btn">SEND</button>
                        </form>

                

    
            </div>


            <!-- RIGHT : MAP -->
            <div class="contact-right">
                 <div class="map-label">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Location</span>
                 </div>

                <iframe src="https://maps.google.com/maps?q=salem%20tamilnadu&t=&z=13&ie=UTF8&iwloc=&output=embed"
                    loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </div>

        </div>

    </section>

   












    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="../contact/contact.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            easing: "ease-in-out",
            once: true
        });
    </script>

</body>

</html>
