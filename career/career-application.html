<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../theme.js" defer></script>
    <title>Career Application | FatCat Wealthy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../common-components/header.css">
    <link rel="stylesheet" href="../common-components/footer.css">
    <link rel="stylesheet" href="../common-components/notifications.css">
    <link rel="stylesheet" href="career-application.css">
    <link rel="stylesheet" href="./career.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="../common-components/header.js" defer></script>
    <script src="../common-components/footer.js" defer></script>
</head>

<body>
   <div id="header"></div>


    <section class="application-page">

        <div class="application-container">

            <div class="application-header">

                <span class="application-tag">
                    CAREER OPPORTUNITY
                </span>

                <h1>Join Our Team</h1>

                <p>
                    Take the next step in your career with FatCat Wealthy.
                    Please provide your details below to apply for this position.
                </p>

            </div>

            <div class="application-card">

                <div class="selected-job">

                    <span>Applying For</span>

                    <h2 id="selectedJob">
                        Position
                    </h2>

                </div>


                <form id="careerForm" onsubmit="return false;">

                    <div class="form-section">

                        <h3>Personal Information</h3>

                        <div class="form-grid">

                            <div class="form-group">

                                <label>
                                    Full Name <span>*</span>
                                </label>

                                <input type="text" id="fullName" placeholder="Enter your full name" required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Email Address <span>*</span>
                                </label>

                                <input type="email" id="email" placeholder="Enter your email" required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Phone Number <span>*</span>
                                </label>

                                <input type="tel" id="phone" placeholder="Enter your phone number" maxlength="10"
                                    required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Location <span>*</span>
                                </label>

                                <input type="text" id="location" placeholder="City / Location" required>

                            </div>

                        </div>

                    </div>

                    <div class="form-section">

                        <h3>Professional Information</h3>

                        <div class="form-grid">

                            <div class="form-group">

                                <label>
                                    Highest Qualification <span>*</span>
                                </label>

                                <input type="text" id="qualification" placeholder="Example: MBA, B.E, B.Sc" required>

                            </div>


                            <div class="form-group">

                                <label>
                                    Total Experience <span>*</span>
                                </label>

                                <select id="experience" required>

                                    <option value="">
                                        Select Experience
                                    </option>

                                    <option value="Fresher">
                                        Fresher
                                    </option>

                                    <option value="1-2 Years">
                                        1–2 Years
                                    </option>

                                    <option value="3-5 Years">
                                        3–5 Years
                                    </option>

                                    <option value="5-10 Years">
                                        5–10 Years
                                    </option>

                                    <option value="10+ Years">
                                        10+ Years
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label>
                                    Current Company
                                </label>

                                <input type="text" id="company" placeholder="Current company">

                            </div>


                            <div class="form-group">

                                <label>
                                    Current Designation
                                </label>

                                <input type="text" id="designation" placeholder="Current designation">

                            </div>

                        </div>

                    </div>

                    <!-- ADDITIONAL DETAILS -->

                    <div class="form-section">

                        <h3>Additional Information</h3>

                        <div class="form-group full">

                            <label>
                                Why should we hire you?
                            </label>

                            <textarea id="message" rows="5"
                                placeholder="Tell us briefly about yourself, your skills and experience..."></textarea>

                        </div>


                        <div class="form-group full">

                            <label>
                                Resume / CV <span>*</span>
                            </label>

                            <input type="file" id="resume" accept=".pdf,.doc,.docx" required>

                            <small>
                                Accepted formats: PDF, DOC, DOCX
                            </small>

                        </div>

                    </div>

                    <div class="form-group full form-terms">
                        <label class="terms-label" for="careerTerms">
                            <input type="checkbox" id="careerTerms" class="terms-checkbox" disabled required>
                            <span>I agree to the <a href="javascript:void(0)" class="open-legal-tab" data-legal="terms">Terms & Conditions</a></span>
                        </label>
                    </div>

                    <div class="application-actions">

                        <button type="button" class="cancel-btn" onclick="cancelApplication()">
                            Cancel
                        </button>


                        <button type="submit" class="submit-btn">
                            Submit Application
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script src="../api-config.js"></script>
    <script src="../common-components/notifications.js"></script>
    <script src="career-application.js"></script>

</body>

</html>
