<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../theme.js" defer></script>
    <title>Login | Fatcat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../common-components/header.css">
    <link rel="stylesheet" href="../common-components/footer.css">
    <link rel="stylesheet" href="../common-components/notifications.css">
    <link rel="stylesheet" href="./login.css">

    <script src="../common-components/header.js" defer></script>
    <script src="../common-components/footer.js" defer></script>
</head>

<body class="login-body">
    <div id="header"></div>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="../home/assets/login-bg.mp4" type="video/mp4">
    </video>

   
    <main class="login-main">

        <div class="login-box">
            <h2>Login</h2>
            <form id="loginForm" novalidate>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <div class="error" id="emailError">
                    </div>

                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <div class="error" id="passwordError">
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn login-btn"> Login </button>
                </div>

                <div class="extra">
                    <p> Don't have an account?
                        <a href="../signup/signup.html"> Sign up </a>
                    </p>
                </div>

            </form>
        </div>
    </main>

   <div id="footer"></div>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof AOS !== "undefined") {
                try {
                    AOS.init({
                        duration: 1000,
                        once: true
                    });
                } catch (e) {
                    console.warn("AOS init skipped:", e);
                }
            }
        });
        window.addEventListener("load", function () {
            if (typeof AOS === "undefined") {
                document.querySelectorAll("[data-aos]").forEach(function (el) {
                    el.removeAttribute("data-aos");
                    el.style.opacity = "1";
                    el.style.transform = "none";
                });
            }
        });
    </script>
    <script src="../api-config.js"></script>
    <script src="../common-components/notifications.js"></script>
    <script src="./login.js"></script>
</body>

</html>
